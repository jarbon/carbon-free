<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TestBucks — Practice coffee shop</title><style>
:root{--green:#435e3d;--ink:#26382b;--cream:#f5f2e8;--line:#d6dbcd}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button,.button{border:0;border-radius:9px;background:var(--green);color:white;padding:12px 19px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{background:#29472f}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ce853b;outline-offset:4px}.secondary{background:#e2e7d8;color:var(--ink)}.secondary:hover{background:#d1dac4}.notice{background:#243e2d;color:#edf2e7;text-align:center;padding:9px;font-size:14px}header{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:23px}header a{color:var(--ink);text-decoration:none}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{background:transparent;color:var(--ink)}nav button[aria-current=page]{background:#e0e7d8}.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:750}.seal{width:44px;height:44px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-size:27px}main{max-width:1150px;margin:0 auto;padding:20px 24px 70px}h1{font-size:clamp(36px,5vw,64px);line-height:1.08;letter-spacing:-.04em;margin:15px 0 25px}h2{line-height:1.2}p{max-width:65ch}.hero{display:grid;grid-template-columns:1.3fr 1fr;align-items:center;background:radial-gradient(at 85% 30%,#d1dfbd,transparent 60%),#e8ebdf;border-radius:26px;padding:40px;min-height:440px}.hero img{width:100%;max-height:370px;object-fit:contain;filter:drop-shadow(0 18px 12px #26382b25)}.eyebrow{letter-spacing:.13em;text-transform:uppercase;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:25px 0}.card{background:#fffdf6;border:1px solid var(--line);border-radius:16px;padding:25px;box-shadow:0 10px 25px #26382b08}.card h2{margin-top:8px}.card p{color:#536451}.price{font-size:25px;font-weight:650}.toolbar{display:flex;gap:16px;align-items:end;flex-wrap:wrap;margin:25px 0}label{display:block;font-weight:600;margin-bottom:6px}input,select{border:1px solid #9ba98f;background:white;color:var(--ink);border-radius:7px;padding:11px;width:100%}.field{margin:17px 0}.field small{display:block;color:#536451}.row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line)}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:30px}.total{font-size:25px;font-weight:700}.muted{color:#62705f}.error{color:#963b24;font-weight:600}.success{border-left:5px solid var(--green);padding:20px;background:#e2ebd8}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.tag{border-radius:20px;background:#e4eadc;padding:4px 11px;font-size:13px}dialog{border:1px solid var(--line);border-radius:18px;max-width:500px;width:calc(100% - 30px);max-height:90vh;padding:30px;background:var(--cream);color:var(--ink)}dialog::backdrop{background:#14291ed0}footer{border-top:1px solid var(--line);padding:25px;text-align:center;font-size:14px}.check{display:flex;align-items:start;gap:10px}.check input{width:auto;margin-top:6px}.qty{width:80px}#status{min-height:25px;color:#435e3d}a{color:#365733}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.drink-art{height:65px;font-size:40px;color:var(--green)}@media(max-width:700px){header{align-items:start;flex-direction:column}nav button{padding:9px}.hero{grid-template-columns:1fr;padding:25px}.hero img{max-height:220px;grid-row:1}.grid,.layout{grid-template-columns:1fr}.row{gap:10px}.card{padding:20px}main{padding:12px 17px 40px}}
</style></head><body><div class="notice">Training website · Synthetic data only · No real payment or order is sent</div><header><a class="brand" href="#home"><span class="seal" aria-hidden="true">✓</span>TestBucks</a><nav aria-label="Main navigation"><button data-page="home">Home</button><button data-page="menu">Menu</button><button data-page="cart">Cart <span id="count">0</span></button><button data-page="orders">Orders</button><button data-page="practice">Practice</button></nav></header><main id="main"></main><footer>Testbox.html · TestBucks Quality Brew · Fictional course project, not affiliated with Starbucks.<br>Data stays in this browser. Do not enter real personal or company information.</footer><dialog id="custom"><form id="custom-form"><h2 id="drink-name">Customize your drink</h2><div class="field"><label for="size">Size</label><select id="size"><option value="small">Small (−$0.50)</option><option value="medium" selected>Medium</option><option value="large">Large (+$0.75)</option></select></div><div class="field"><label for="milk">Milk</label><select id="milk"><option value="regular">Regular</option><option value="oat">Oat (+$0.75)</option><option value="almond">Almond (+$0.75)</option></select></div><label class="check"><input type="checkbox" id="shot">Extra espresso shot (+$0.80)</label><div class="field"><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" max="10" value="1" required></div><p class="price" id="custom-price"></p><div class="actions"><button type="submit">Add to cart</button><button type="button" class="secondary" id="cancel">Cancel</button></div></form></dialog><script>
const catalog=[{id:'vanilla-latte',name:'Vanilla latte',price:450,category:'coffee',description:'Espresso and steamed milk with vanilla. The course’s shared intent example.'},{id:'latte',name:'Latte',price:450,category:'coffee',description:'Espresso, steamed milk, and a little everyday comfort.'},{id:'cappuccino',name:'Cappuccino',price:425,category:'coffee',description:'A bold espresso base with a cloud of silky foam.'},{id:'coldbrew',name:'Cold brew',price:400,category:'coffee',description:'Slow steeped. Smooth, bright, and served cold.'},{id:'mocha',name:'Mocha',price:500,category:'coffee',description:'Chocolate meets espresso. A very productive pairing.'},{id:'matcha',name:'Matcha latte',price:475,category:'tea',description:'Earthy green tea with your choice of milk.'},{id:'chai',name:'Chai latte',price:450,category:'tea',description:'Warming spices, black tea, and steamed milk.'}];
const key='testbucks-practice-v1';let state={cart:[],orders:[]};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.cart)&&Array.isArray(saved.orders))state=saved}catch{}let selected=null,promo=state.promo===true,search='',category='all';const $=s=>document.querySelector(s),money=n=>'$'+(n/100).toFixed(2),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){state.promo=promo;try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('Browser storage is unavailable. This session will not survive a reload.')}}function unit(item){return catalog.find(d=>d.id===item.id).price+({small:-50,medium:0,large:75}[item.size])+ (item.milk==='regular'?0:75)+(item.shot?80:0)}function totals(){const subtotal=state.cart.reduce((s,i)=>s+unit(i)*i.qty,0),discount=promo?Math.round(subtotal*.1):0,tax=Math.round((subtotal-discount)*.1);return{subtotal,discount,tax,total:subtotal-discount+tax}}function go(page){location.hash=page}function summary(){let t=totals();return `<div class="row"><span>Subtotal</span><span>${money(t.subtotal)}</span></div><div class="row"><span>Discount</span><span>−${money(t.discount)}</span></div><div class="row"><span>Training tax (10%)</span><span>${money(t.tax)}</span></div><div class="row total"><span>Total</span><span>${money(t.total)}</span></div><p class="muted">Tax is rounded to the nearest cent after discount.</p>`}function options(i){return `${i.size} · ${i.milk} milk${i.shot?' · extra shot':''}`}
function render(){let page=location.hash.slice(1)||'home';$('#count').textContent=state.cart.reduce((s,i)=>s+i.qty,0);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));let html='';if(page==='home')html=`<section class="hero"><div><span class="eyebrow">Quality brew. Every time.</span><h1>Your coffee.<br>Your way.</h1><p>A familiar little shop for exploring surprisingly interesting software. Customize a drink, review the price, and try a simulated checkout.</p><a class="button" href="#menu">Order a coffee</a></div><img src="testbucks-cup.png" alt="TestBucks paper coffee cup with a green Quality Brew bug logo"></section><div class="grid"><section class="card"><h2>Made for you</h2><p>Three sizes, three milks, an extra shot. Plenty of combinations to explore.</p></section><section class="card"><h2>Clear pricing</h2><p>See every addition, discount, and cent of training tax before ordering.</p></section><section class="card"><h2>Practice safely</h2><p>No account required. No real payment. Only fictional pickup orders.</p><a href="#practice">Explore the exercises →</a></section></div>`;
else if(page==='menu')html=`<span class="eyebrow">Find your next favorite</span><h1>The menu</h1><div class="toolbar"><div><label for="search">Search drinks</label><input id="search" type="search" value="${esc(search)}" placeholder="Try latte"></div><div><label for="category">Category</label><select id="category"><option value="all">All drinks</option><option value="coffee">Coffee</option><option value="tea">Tea</option></select></div></div><div id="products" class="grid"></div><p id="status" role="status"></p>`;
else if(page==='cart')html=`<h1>Your cart</h1>${!state.cart.length?'<p>Your cart is empty. Start with something delicious.</p><a class="button" href="#menu">Browse the menu</a>':`<div class="layout"><section>${state.cart.map((i,n)=>`<article class="card"><h2>${esc(catalog.find(d=>d.id===i.id).name)}</h2><p>${options(i)} · ${money(unit(i))} each</p><div class="row"><div><label for="qty-${n}">Quantity</label><input class="qty" id="qty-${n}" data-qty="${n}" type="number" min="1" max="10" value="${i.qty}"></div><strong>${money(unit(i)*i.qty)}</strong><button class="secondary" data-remove="${n}">Remove</button></div></article>`).join('')}</section><aside class="card"><h2>Order summary</h2>${summary()}<form id="promo-form"><label for="promo">Promo code</label><input id="promo" placeholder="Try BREW10" value="${promo?'BREW10':''}"><button style="margin-top:10px">Apply code</button><p id="promo-status" role="status">${promo?'BREW10 applied: 10% off.':''}</p></form><a class="button" href="#checkout">Continue to checkout</a></aside></div>`}`;
else if(page==='checkout'){if(!state.cart.length){go('cart');return}html=`<h1>Review your order</h1><div class="layout"><form id="checkout" class="card"><h2>Simulated pickup</h2><div class="field"><label for="name">Practice name</label><input id="name" required maxlength="60" placeholder="Alex Example" autocomplete="off"><small>Use a fictional name—not your personal details.</small></div><div class="field"><label for="store">Pickup store</label><select id="store" required><option value="">Choose a store</option><option>Kirkland</option><option>Seattle</option><option>Bellevue</option></select></div><div class="field"><label for="pickup">Pickup time</label><select id="pickup"><option>In 10 minutes</option><option>In 20 minutes</option><option>In 30 minutes</option></select></div><div class="field"><label for="scenario">Practice payment scenario</label><select id="scenario"><option value="success">Successful simulated payment</option><option value="decline">Payment declined</option><option value="timeout">Payment timeout (no charge)</option></select></div><label class="check"><input id="consent" type="checkbox" required>I understand this is a training order. No real payment is made.</label><p id="checkout-status" role="status"></p><button id="place">Place simulated order</button></form><aside class="card"><h2>Order summary</h2><ul>${state.cart.map(i=>`<li>${i.qty} × ${esc(catalog.find(d=>d.id===i.id).name)}<br><small>${esc(options(i))}</small></li>`).join('')}</ul><h3>Final price</h3>${summary()}<a href="#cart">Edit cart</a><p>No credit card information is requested or stored.</p></aside></div>`}
else if(page==='orders')html=`<h1>Your practice orders</h1><p class="muted">Saved in this browser only. Reload to check persistence.</p>${!state.orders.length?'<p>No orders yet.</p><a class="button" href="#menu">Browse menu</a>':state.orders.slice().reverse().map(o=>`<article class="card"><span class="tag">${o.cancelled?'Cancelled · simulated refund':'Confirmed · simulated payment'}</span><h2>${esc(o.id)} · ${money(o.total)}</h2><p>${esc(o.name)} · ${esc(o.store)} · ${esc(o.pickup)}</p><p>${o.items.map(i=>`${i.qty} × ${esc(catalog.find(d=>d.id===i.id).name)} (${options(i)})`).join('<br>')}</p><p>${esc(new Date(o.date).toLocaleString())}</p>${o.cancelled?'':`<button class="secondary" data-cancel="${esc(o.id)}">Cancel practice order</button>`}</article>`).join('')}`;
else if(page==='practice')html=`<h1>Pause. Explore. Explain.</h1><p>This is a working local practice application, not a production shop. Use an AI coding agent to investigate it, then compare the evidence with these rules.</p><div class="grid"><section class="card"><h2>Check a snapshot</h2><p>Capture a cart screenshot. Inspect copy, layout, and arithmetic. A medium latte + oat milk + extra shot should total $6.66 including tax.</p></section><section class="card"><h2>Test a journey</h2><p>Find a drink, customize it, change quantity, apply BREW10, and order. Verify one order is saved and the cart is cleared. Reload and inspect history.</p></section><section class="card"><h2>Explore boundaries</h2><p>Try quantities 0, 1, 10, and 11; whitespace names; empty search results; an invalid promo; and repeated submission.</p></section><section class="card"><h2>Recover from failure</h2><p>Select declined or timeout at checkout. Confirm the cart remains intact and no order is created. Switch to success and retry.</p></section><section class="card"><h2>Accessibility & layout</h2><p>Use the keyboard, enlarge text, narrow the browser, and inspect labels and contrast. Report observations, not assumed passes.</p></section><section class="card"><h2>Pricing contract</h2><p>Small −$0.50; large +$0.75; oat/almond +$0.75; extra shot +$0.80. BREW10 discounts the subtotal by 10%, rounded to cents. Then add 10% tax, rounded to cents. Quantity: 1–10 per item.</p></section></div><button class="secondary" id="reset">Reset practice data</button><p>Reset removes only this shop’s cart and orders from this browser.</p>`;
else{go('home');return}$('#main').innerHTML=html;bind(page)}
function products(){let list=catalog.filter(d=>(category==='all'||d.category===category)&&d.name.toLowerCase().includes(search.toLowerCase()));$('#products').innerHTML=list.length?list.map(d=>`<article class="card"><div class="drink-art" aria-hidden="true">♨</div><span class="tag">${d.category}</span><h2>${d.name}</h2><p>${d.description}</p><p class="price">${money(d.price)}</p><button data-drink="${d.id}">Customize ${d.name}</button></article>`).join(''):'<p>No drinks match. Try another search or category.</p>';$('#products').querySelectorAll('[data-drink]').forEach(b=>b.onclick=()=>{selected=catalog.find(d=>d.id===b.dataset.drink);$('#custom-form').reset();$('#drink-name').textContent=selected.name;preview();$('#custom').showModal()})}
function preview(){if(selected)$('#custom-price').textContent=money(unit({id:selected.id,size:$('#size').value,milk:$('#milk').value,shot:$('#shot').checked})*Number($('#quantity').value||1))}
function bind(page){if(page==='menu'){$('#category').value=category;products();$('#search').oninput=e=>{search=e.target.value;products()};$('#category').onchange=e=>{category=e.target.value;products()}}document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.cart.splice(+b.dataset.remove,1);save();render()});document.querySelectorAll('[data-qty]').forEach(i=>i.onchange=()=>{const n=Number(i.value);if(!Number.isInteger(n)||n<1||n>10){i.setCustomValidity('Use a whole number from 1 to 10.');i.reportValidity();i.value=state.cart[+i.dataset.qty].qty;i.setCustomValidity('');return}state.cart[+i.dataset.qty].qty=n;save();render()});if($('#promo-form'))$('#promo-form').onsubmit=e=>{e.preventDefault();promo=$('#promo').value.trim().toUpperCase()==='BREW10';save();render();$('#promo-status').textContent=promo?'BREW10 applied: 10% off.':'Invalid code. No discount applied.'};if($('#checkout'))$('#checkout').onsubmit=async e=>{e.preventDefault();const name=$('#name').value.trim();if(!name){$('#name').setCustomValidity('Enter a fictional name, not just spaces.');$('#name').reportValidity();return}const button=$('#place');if(button.disabled)return;button.disabled=true;button.textContent='Processing simulation…';const scenario=$('#scenario').value,store=$('#store').value,pickup=$('#pickup').value;await new Promise(r=>setTimeout(r,900));if(!document.body.contains(button))return;if(scenario!=='success'){$('#checkout-status').textContent=scenario==='decline'?'Simulated payment declined. Nothing was charged. Your cart is preserved.':'Simulated timeout. No charge or order was created. Try again.';$('#checkout-status').className='error';button.disabled=false;button.textContent='Retry simulated order';return}const order={id:'TB-'+Date.now().toString(36).toUpperCase(),name,store,pickup,date:new Date().toISOString(),items:state.cart.map(i=>({...i})),...totals(),cancelled:false};state.orders.push(order);state.cart=[];promo=false;save();go('orders')};if($('#name'))$('#name').oninput=()=>$('#name').setCustomValidity('');document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{if(confirm('Cancel this simulated order?')){state.orders.find(o=>o.id===b.dataset.cancel).cancelled=true;save();render()}});if($('#reset'))$('#reset').onclick=()=>{if(confirm('Reset all TestBucks practice cart and order data in this browser?')){state={cart:[],orders:[]};promo=false;save();go('home')}}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#cancel').onclick=()=>$('#custom').close();$('#custom-form').oninput=preview;$('#custom-form').onsubmit=e=>{e.preventDefault();const qty=Number($('#quantity').value);if(!Number.isInteger(qty)||qty<1||qty>10)return;state.cart.push({id:selected.id,size:$('#size').value,milk:$('#milk').value,shot:$('#shot').checked,qty});save();$('#custom').close();render();$('#status').textContent=selected.name+' added to cart.'};window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
